hc_repro:
  target: dev
  outputs:
    dev:
      type: fabricspark
      method: livy
      authentication: CLI
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID') }}"
      workspace_name: "{{ env_var('FABRIC_WORKSPACE_NAME') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME') }}"
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID') }}"
      schema: "{{ env_var('FABRIC_SCHEMA', 'hc_repro') }}"
      high_concurrency: true
      reuse_session: true
      spark_config:
        name: hc-repro
      session_start_timeout: 600
      threads: "{{ env_var('DBT_THREADS', '1') | int }}"
